<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Glazycious</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'brand-red': '#9b1b30',
                        'brand-light': '#fdf8f5',
                        'brand-dark': '#333333',
                        'brand-pink': '#faeaea',
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #fdf8f5; }
    </style>
</head>
<body class="text-brand-dark antialiased min-h-screen flex items-center justify-center py-10">

    <!-- Container Sign Up -->
    <div class="bg-white p-10 rounded-3xl shadow-xl max-w-md w-full mx-4 relative overflow-hidden">
        
        <!-- Ornamen Dekorasi Background -->
        <div class="absolute -top-10 -right-10 w-32 h-32 bg-brand-pink rounded-full opacity-60"></div>
        <div class="absolute -bottom-10 -left-10 w-32 h-32 bg-brand-pink rounded-full opacity-60"></div>

        <div class="relative z-10">
            <!-- Header Logo -->
            <div class="text-center mb-8">
                <h1 class="text-4xl font-bold text-brand-red mb-2">Glazycious</h1>
                <p class="text-gray-500 text-sm font-medium">Create an account to track your orders!</p>
            </div>

            <!-- Form Sign Up -->
            <form id="signupForm" class="space-y-4">
                
                <!-- Input Full Name -->
                <div>
                    <label class="block text-sm font-bold mb-1 text-gray-700">Full Name</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none">
                            <i class="fa-regular fa-user text-gray-400"></i>
                        </div>
                        <input type="text" id="fullName" placeholder="Enter your full name" required class="w-full border border-gray-300 rounded-xl py-2.5 pl-11 pr-4 focus:outline-none focus:border-brand-red focus:ring-1 focus:ring-brand-red text-sm transition">
                    </div>
                </div>

                <!-- Input Email -->
                <div>
                    <label class="block text-sm font-bold mb-1 text-gray-700">Email Address</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none">
                            <i class="fa-regular fa-envelope text-gray-400"></i>
                        </div>
                        <input type="email" id="email" placeholder="Enter your email" required class="w-full border border-gray-300 rounded-xl py-2.5 pl-11 pr-4 focus:outline-none focus:border-brand-red focus:ring-1 focus:ring-brand-red text-sm transition">
                    </div>
                </div>

                <!-- Input Password -->
                <div>
                    <label class="block text-sm font-bold mb-1 text-gray-700">Password</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none">
                            <i class="fa-solid fa-lock text-gray-400"></i>
                        </div>
                        <input type="password" id="password" placeholder="Create a password" required class="w-full border border-gray-300 rounded-xl py-2.5 pl-11 pr-10 focus:outline-none focus:border-brand-red focus:ring-1 focus:ring-brand-red text-sm transition">
                    </div>
                </div>

                <!-- Input Confirm Password -->
                <div>
                    <label class="block text-sm font-bold mb-1 text-gray-700">Confirm Password</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none">
                            <i class="fa-solid fa-lock text-gray-400"></i>
                        </div>
                        <input type="password" id="confirmPassword" placeholder="Repeat your password" required class="w-full border border-gray-300 rounded-xl py-2.5 pl-11 pr-10 focus:outline-none focus:border-brand-red focus:ring-1 focus:ring-brand-red text-sm transition">
                    </div>
                </div>

                <!-- Terms & Conditions -->
                <div class="flex items-start pt-2">
                    <input type="checkbox" id="terms" required class="w-4 h-4 mt-0.5 text-brand-red bg-gray-100 border-gray-300 rounded focus:ring-brand-red focus:ring-2 accent-brand-red cursor-pointer">
                    <label for="terms" class="ml-2 text-xs font-medium text-gray-600 cursor-pointer leading-tight">
                        I agree to the <a href="#" class="text-brand-red hover:underline">Terms & Conditions</a> and <a href="#" class="text-brand-red hover:underline">Privacy Policy</a>
                    </label>
                </div>

                <!-- Tombol Submit -->
                <button type="submit" class="w-full bg-brand-red text-white py-3 rounded-full font-bold hover:bg-red-800 transition shadow-md mt-4">
                    SIGN UP
                </button>
            </form>

            <!-- Link Balik ke Login -->
            <p class="mt-8 text-center text-sm text-gray-600 font-medium">
                Already have an account? <a href="login.html" class="text-brand-red font-bold hover:underline">Login</a>
            </p>
        </div>
    </div>

    <!-- Supabase CDN & Client Config -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/supabaseClient.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            // Check if user is already logged in
            const user = await getCurrentUser();
            if (user) {
                window.location.href = 'index.html';
                return;
            }

            const signupForm = document.getElementById('signupForm');
            const fullNameInput = document.getElementById('fullName');
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const confirmPasswordInput = document.getElementById('confirmPassword');
            const termsCheckbox = document.getElementById('terms');
            const submitBtn = signupForm.querySelector('button[type="submit"]');

            signupForm.addEventListener('submit', async (e) => {
                e.preventDefault();

                if (!supabaseClient) {
                    alert('Supabase belum terkonfigurasi. Silakan isi URL dan API Key Anda di assets/js/supabaseClient.js');
                    return;
                }

                const fullName = fullNameInput.value.trim();
                const email = emailInput.value.trim();
                const password = passwordInput.value;
                const confirmPassword = confirmPasswordInput.value;

                if (password !== confirmPassword) {
                    alert('Password dan Konfirmasi Password tidak cocok!');
                    return;
                }

                if (!termsCheckbox.checked) {
                    alert('Anda harus menyetujui syarat & ketentuan untuk mendaftar.');
                    return;
                }

                submitBtn.disabled = true;
                submitBtn.innerText = 'REGISTERING...';

                try {
                    const { data, error } = await supabaseClient.auth.signUp({
                        email,
                        password,
                        options: {
                            data: {
                                full_name: fullName
                            }
                        }
                    });

                    if (error) throw error;

                    alert('Registrasi berhasil! Silakan periksa email Anda untuk memverifikasi akun (jika diaktifkan di dashboard Supabase), lalu silakan login.');
                    window.location.href = 'login.html';
                } catch (error) {
                    alert('Gagal Registrasi: ' + error.message);
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.innerText = 'SIGN UP';
                }
            });
        });
    </script>
</body>
</html>
