<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glazycious - Lacak Pesanan</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Konfigurasi Warna Tema Awal -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'brand-red': '#9b1b30',
                        'brand-light': '#fdf8f5',
                        'brand-dark': '#333333',
                        'brand-pink': '#faeaea', 
                    }
                }
            }
        }
    </script>
    <!-- Font Poppins & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #fdf8f5; /* Background krem khas website awal */
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start p-6 pt-12 select-none text-brand-dark">

    <!-- Header -->
    <div class="w-full max-w-2xl flex items-center justify-between mb-12 px-2">
        <a href="index.html" class="text-brand-dark hover:text-brand-red transition">
            <i class="fa-solid fa-arrow-left text-2xl"></i>
        </a>
        <h1 class="text-3xl font-bold text-brand-red tracking-wide pr-8">Lacak Pesanan</h1>
        <div></div> <!-- Spacing balancer agar teks tepat di tengah -->
    </div>

    <!-- Kolom Input Resi -->
    <div class="w-full max-w-2xl mb-6 px-2">
        <div class="flex gap-2 bg-white p-2 rounded-2xl shadow-sm border border-gray-200">
            <input type="text" id="inputResi" placeholder="Masukkan ID Transaksi (Contoh: GZY-1234)" class="w-full p-3 text-sm rounded-xl border-none focus:outline-none bg-white text-gray-700 font-medium">
            <button onclick="prosesLacak()" class="bg-brand-red hover:bg-red-800 text-white text-sm font-bold px-6 py-3 rounded-xl transition shadow-sm whitespace-nowrap">Lacak</button>
        </div>
    </div>

    <!-- Rincian Pesanan (Akan muncul jika pesanan ditemukan) -->
    <div id="orderInfoBox" class="w-full max-w-2xl mb-6 px-2 hidden">
        <div class="bg-white rounded-2xl p-5 border border-gray-200 shadow-sm text-xs space-y-2">
            <div class="flex justify-between"><span class="text-gray-400">Nama Pelanggan:</span><span id="infoCustomerName" class="font-bold text-gray-700">-</span></div>
            <div class="flex justify-between"><span class="text-gray-400">Outlet Pengambilan:</span><span id="infoOutlet" class="font-bold text-gray-700">-</span></div>
            <div class="flex justify-between"><span class="text-gray-400">Total Belanja:</span><span id="infoTotal" class="font-bold text-red-800">-</span></div>
            <div class="flex justify-between"><span class="text-gray-400">Waktu Transaksi:</span><span id="infoTime" class="font-bold text-gray-700">-</span></div>
        </div>
    </div>

    <!-- Box Tracking (Tema Glazycious 4 Langkah) -->
    <div class="w-full max-w-2xl px-2">
        <div class="bg-brand-pink rounded-[2rem] p-8 md:p-10 shadow-sm border border-red-50">
            
            <!-- Judul Box -->
            <p class="text-brand-dark font-semibold text-base md:text-lg mb-10 text-center">Status Pesanan Anda</p>

            <div class="relative flex items-center justify-between">
                
                <!-- Garis Penghubung (Z-index 0 agar berada di belakang lingkaran) -->
                <div class="absolute left-[10%] right-[10%] top-8 md:top-10 h-[3px] bg-gray-200 z-0">
                    <div id="activeProgressLine" class="h-full bg-brand-red w-0 transition-all duration-500"></div>
                </div>

                <!-- Step 1: Pesanan Diterima -->
                <div class="flex flex-col items-center z-10 flex-1">
                    <div id="circle1" class="w-16 h-16 md:w-20 md:h-20 border-[3px] border-gray-200 bg-white rounded-full flex items-center justify-center mb-4 text-gray-300 transition-all">
                        <i class="fa-solid fa-receipt text-2xl md:text-3xl"></i>
                    </div>
                    <span id="text1" class="text-[11px] md:text-sm font-medium text-gray-400 leading-tight tracking-wide text-center uppercase">PESANAN<br>DITERIMA</span>
                </div>
                
                <!-- Step 2: Sedang Diproses -->
                <div class="flex flex-col items-center z-10 flex-1">
                    <div id="circle2" class="w-16 h-16 md:w-20 md:h-20 border-[3px] border-gray-200 bg-white rounded-full flex items-center justify-center mb-4 text-gray-300 transition-all">
                        <i class="fa-solid fa-fire-burner text-2xl md:text-3xl"></i>
                    </div>
                    <span id="text2" class="text-[11px] md:text-sm font-medium text-gray-400 leading-tight tracking-wide text-center uppercase">SEDANG<br>DIPROSES</span>
                </div>
                
                <!-- Step 3: Siap Diambil -->
                <div class="flex flex-col items-center z-10 flex-1">
                    <div id="circle3" class="w-16 h-16 md:w-20 md:h-20 border-[3px] border-gray-200 bg-white rounded-full flex items-center justify-center mb-4 text-gray-300 transition-all">
                        <i class="fa-solid fa-store text-2xl md:text-3xl"></i>
                    </div>
                    <span id="text3" class="text-[11px] md:text-sm font-medium text-gray-400 leading-tight tracking-wide text-center uppercase">SIAP<br>DIAMBIL</span>
                </div>
                
                <!-- Step 4: Selesai -->
                <div class="flex flex-col items-center z-10 flex-1">
                    <div id="circle4" class="w-16 h-16 md:w-20 md:h-20 border-[3px] border-gray-200 bg-white rounded-full flex items-center justify-center mb-4 text-gray-300 transition-all">
                        <i class="fa-solid fa-check text-2xl md:text-3xl"></i>
                    </div>
                    <span id="text4" class="text-[11px] md:text-sm font-medium text-gray-400 leading-tight tracking-wide text-center uppercase">PESANAN<br>SELESAI</span>
                </div>
                
            </div>
        </div>
    </div>

    <!-- Supabase CDN & Config -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/supabaseClient.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Periksa jika ada ID transaksi langsung dari parameter URL (?id=GZY-1234)
            const urlParams = new URLSearchParams(window.location.search);
            const orderId = urlParams.get('id');
            if (orderId) {
                document.getElementById('inputResi').value = orderId;
                lacakTransaksi(orderId);
            }
        });

        async function prosesLacak() {
            const resi = document.getElementById('inputResi').value.trim();
            if (!resi) {
                alert("Silakan masukkan ID Transaksi terlebih dahulu.");
                return;
            }
            lacakTransaksi(resi);
        }

        async function lacakTransaksi(resiId) {
            if (!supabaseClient) {
                alert("Supabase Client belum dikonfigurasikan di assets/js/supabaseClient.js!");
                return;
            }

            try {
                // Query pesanan berdasarkan ID
                const { data: order, error } = await supabaseClient
                    .from('orders')
                    .select('*')
                    .eq('id', resiId)
                    .single();

                if (error || !order) {
                    alert(`Pesanan dengan ID "${resiId}" tidak ditemukan.`);
                    resetStatusUI();
                    return;
                }

                // Tampilkan info pesanan
                document.getElementById('orderInfoBox').classList.remove('hidden');
                document.getElementById('infoCustomerName').innerText = order.customer_name;
                document.getElementById('infoOutlet').innerText = order.outlet;
                document.getElementById('infoTotal').innerText = "Rp " + new Intl.NumberFormat('id-ID').format(order.total_price);
                document.getElementById('infoTime').innerText = new Date(order.created_at).toLocaleString('id-ID');

                // Update visual status tracking
                updateStatusUI(order.status);

            } catch (err) {
                console.error("Gagal melacak transaksi:", err);
                alert("Terjadi kesalahan sistem saat melacak pesanan.");
            }
        }

        function updateStatusUI(status) {
            resetStatusUI();

            const c1 = document.getElementById('circle1');
            const c2 = document.getElementById('circle2');
            const c3 = document.getElementById('circle3');
            const c4 = document.getElementById('circle4');

            const t1 = document.getElementById('text1');
            const t2 = document.getElementById('text2');
            const t3 = document.getElementById('text3');
            const t4 = document.getElementById('text4');

            const line = document.getElementById('activeProgressLine');

            const activeCircle = "border-brand-red text-brand-red bg-brand-pink shadow-md scale-105";
            const activeText = "text-brand-red font-extrabold";

            // Status mapping dan visual progress
            if (status === 'PESANAN DITERIMA') {
                c1.className = `w-16 h-16 md:w-20 md:h-20 border-[3px] rounded-full flex items-center justify-center mb-4 transition-all ${activeCircle}`;
                t1.className = `text-[11px] md:text-sm leading-tight tracking-wide text-center uppercase ${activeText}`;
                line.style.width = '0%';
            } else if (status === 'SEDANG DIPROSES') {
                c1.className = `w-16 h-16 md:w-20 md:h-20 border-[3px] rounded-full flex items-center justify-center mb-4 transition-all ${activeCircle}`;
                t1.className = `text-[11px] md:text-sm leading-tight tracking-wide text-center uppercase ${activeText}`;
                
                c2.className = `w-16 h-16 md:w-20 md:h-20 border-[3px] rounded-full flex items-center justify-center mb-4 transition-all ${activeCircle}`;
                t2.className = `text-[11px] md:text-sm leading-tight tracking-wide text-center uppercase ${activeText}`;
                
                line.style.width = '33.3%';
            } else if (status === 'SIAP DIAMBIL') {
                c1.className = `w-16 h-16 md:w-20 md:h-20 border-[3px] rounded-full flex items-center justify-center mb-4 transition-all ${activeCircle}`;
                t1.className = `text-[11px] md:text-sm leading-tight tracking-wide text-center uppercase ${activeText}`;
                
                c2.className = `w-16 h-16 md:w-20 md:h-20 border-[3px] rounded-full flex items-center justify-center mb-4 transition-all ${activeCircle}`;
                t2.className = `text-[11px] md:text-sm leading-tight tracking-wide text-center uppercase ${activeText}`;
                
                c3.className = `w-16 h-16 md:w-20 md:h-20 border-[3px] rounded-full flex items-center justify-center mb-4 transition-all ${activeCircle}`;
                t3.className = `text-[11px] md:text-sm leading-tight tracking-wide text-center uppercase ${activeText}`;
                
                line.style.width = '66.6%';
            } else if (status === 'PESANAN SELESAI') {
                c1.className = `w-16 h-16 md:w-20 md:h-20 border-[3px] rounded-full flex items-center justify-center mb-4 transition-all ${activeCircle}`;
                t1.className = `text-[11px] md:text-sm leading-tight tracking-wide text-center uppercase ${activeText}`;
                
                c2.className = `w-16 h-16 md:w-20 md:h-20 border-[3px] rounded-full flex items-center justify-center mb-4 transition-all ${activeCircle}`;
                t2.className = `text-[11px] md:text-sm leading-tight tracking-wide text-center uppercase ${activeText}`;
                
                c3.className = `w-16 h-16 md:w-20 md:h-20 border-[3px] rounded-full flex items-center justify-center mb-4 transition-all ${activeCircle}`;
                t3.className = `text-[11px] md:text-sm leading-tight tracking-wide text-center uppercase ${activeText}`;
                
                c4.className = `w-16 h-16 md:w-20 md:h-20 border-[3px] rounded-full flex items-center justify-center mb-4 transition-all ${activeCircle}`;
                t4.className = `text-[11px] md:text-sm leading-tight tracking-wide text-center uppercase ${activeText}`;
                
                line.style.width = '100%';
            }
        }

        function resetStatusUI() {
            document.getElementById('orderInfoBox').classList.add('hidden');
            const circles = ['circle1', 'circle2', 'circle3', 'circle4'];
            const texts = ['text1', 'text2', 'text3', 'text4'];

            const inactiveCircle = "border-gray-200 bg-white text-gray-300";
            const inactiveText = "text-gray-400 font-medium";

            circles.forEach(id => {
                const el = document.getElementById(id);
                if (el) el.className = `w-16 h-16 md:w-20 md:h-20 border-[3px] rounded-full flex items-center justify-center mb-4 transition-all ${inactiveCircle}`;
            });

            texts.forEach(id => {
                const el = document.getElementById(id);
                if (el) el.className = `text-[11px] md:text-sm leading-tight tracking-wide text-center uppercase ${inactiveText}`;
            });

            const line = document.getElementById('activeProgressLine');
            if (line) line.style.width = '0%';
        }
    </script>
</body>
</html>
